name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["TAG_NAME"]
          ver = tag[1:] if tag.startswith("v") else tag
          changelog = pathlib.Path("CHANGELOG.md")
          notes = f"Release {tag}\n"
          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              pattern = re.compile(
                  rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                  flags=re.M | re.S,
              )
              match = pattern.search(text)
              if match and match.group(1).strip():
                  notes = match.group(1).strip() + "\n"
          pathlib.Path("/tmp/release_notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --notes-file /tmp/release_notes.md
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file /tmp/release_notes.md
          fi
