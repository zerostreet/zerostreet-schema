[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zerostreet-schema"
version = "0.1.0"
description = "ZeroStreet Point-in-Time multimodal data, policy configuration, RunTrace, and ThesisManifest Pydantic v2 contracts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zerostreet_schema"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
